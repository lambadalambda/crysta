[package]
name = "oracle"
description = "Reference execution boundary: vendored ares core plus deterministic frame stepping"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
memory-map = { path = "../memory-map" }
rom = { path = "../rom" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1.1"

[lints]
rust.unsafe_code = "allow"
clippy.all = { level = "warn", priority = -1 }
clippy.pedantic = "warn"
