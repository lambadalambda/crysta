[package]
name = "pandora-web"
description = "Stateful browser-local adapter for the source-derived Pandora preview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
map-inspector = { path = "../map-inspector" }

[dev-dependencies]
rom = { path = "../rom" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
