# Outside the workspace, as the native app is: the web build has its own
# dependency closure (wasm-bindgen) and lockfile.
#
#   sh crates/crysta-web/build.sh
[workspace]

[package]
name = "crysta-web"
description = "The Crysta slice in a browser, from the player's own ROM"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lambadalambda/crysta"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crysta-app = { path = "../crysta-app", default-features = false }
crysta-runtime = { path = "../crysta-runtime" }
rom = { path = "../rom" }
room-core = { path = "../room-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "warn"
