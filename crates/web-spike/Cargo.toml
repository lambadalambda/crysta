[package]
name = "web-spike"
description = "Bounded browser-local validation, packet decode, and synthetic replay experiment"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rom = { path = "../rom" }
assets = { path = "../assets" }
room-core = { path = "../room-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# MIT OR Apache-2.0; CLI must match this exact version. No wasm-pack/bundler.
wasm-bindgen = "=0.2.126"
